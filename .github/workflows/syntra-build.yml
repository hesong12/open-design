name: Syntra — build & push Docker image

on:
  push:
    branches: [syntra/remove-none-freeform, syntra/main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'skills/**'
      - 'design-systems/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/syntra-build.yml'
  workflow_dispatch:

concurrency:
  group: syntra-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push ghcr.io/hesong12/open-design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/hesong12/open-design:syntra
            ghcr.io/hesong12/open-design:syntra-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
